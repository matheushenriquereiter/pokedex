<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokéAPI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>PokéAPI</h1>
    </header>

    <main>
      <form id="adicionar-pokemon-form">
        <label>
          Nome ou número:
          <input
            id="nome-pokemon-input"
            list="sugestoes-pokemon"
            type="text"
            placeholder="Digite seu pokémon..."
            name="nomePokemon"
          />
          <datalist id="sugestoes-pokemon"> </datalist>
        </label>

        <button type="submit">Adicionar</button>
      </form>

      <p id="erro-mensagem" class="erro-mensagem"></p>

      <div id="cards-pokemon"></div>
    </main>

    <script src="main.js"></script>
  </body>
</html>
