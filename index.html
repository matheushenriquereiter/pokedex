<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokéAPI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-box">
        <h1>PokéAPI</h1>

        <nav>
          <a href="index.html">Home</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="form-container">
        <form class="form" id="adicionar-pokemon-form">
          <h2>Adicionar Pokémon</h2>

          <label>
            Nome ou número:
            <input
              id="nome-pokemon-input"
              list="sugestoes-pokemon"
              type="text"
              placeholder="Digite seu pokémon..."
              name="nomePokemon"
            />
            <datalist id="sugestoes-pokemon"> </datalist>
          </label>

          <button type="submit">Adicionar</button>

          <p id="erro-mensagem" class="erro-mensagem">&nbsp;</p>
        </form>
      </div>

      <div class="cards-pokemon-container">
        <div class="cards-pokemon" id="cards-pokemon"></div>
      </div>
    </main>

    <script src="main.js"></script>
  </body>
</html>
